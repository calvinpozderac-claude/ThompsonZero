[package]
name = "thompsonzero"
version = "0.1.0"
edition = "2021"
description = "ThompsonZero: Thompson-sampling MCTS over Dirichlet value beliefs"
license = "Apache-2.0"

[lib]
name = "thompsonzero"
crate-type = ["cdylib", "rlib"]

[features]
# Built by maturin (see pyproject.toml).  Plain `cargo test` leaves it off so
# the unit tests link without a Python interpreter.
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
rayon = "1.10"
rand = { version = "0.9", features = ["small_rng"] }
rand_distr = "0.5"
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py310"], optional = true }
numpy = { version = "0.25", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
